name: Deploy to staging

# Fires on every push to the "staging" branch. Builds a production-ready
# copy of the app (vendor/ and compiled assets included, since the cPanel
# host has no SSH to run composer/npm itself), uploads it over FTPS, then
# calls the deploy hook so Laravel runs its post-deploy commands
# (migrate, config:cache, route:cache, ...) — see deploy/hook.php.

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, mysql, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package release into a single archive
        run: |
          mkdir -p /tmp/release dist
          rsync -a --exclude-from='.github/deploy-exclude.txt' ./ /tmp/release/
          cd /tmp/release && zip -rq "$GITHUB_WORKSPACE/dist/release.zip" .

      - name: Upload release archive over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_HOST }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ${{ secrets.STAGING_FTP_SERVER_DIR }}
          dangerous-clean-slate: false

       - name: Extract uploaded release
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.STAGING_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true extract

      - name: Trigger post-deploy Artisan tasks
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.STAGING_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true artisan
