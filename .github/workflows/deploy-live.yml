name: Deploy to live

# Fires on every push to "main" (the live branch). Identical build steps to
# staging, but the release is split into two uploads because 101gsd.in's
# document root is fixed to public_html and can't be pointed at
# live_app/public: the app code (everything except public/) goes to
# live_app/, and only the built public/ folder's contents go to public_html/.
#
# This uses the "production" GitHub Environment, which you configure with a
# required reviewer (Settings -> Environments -> production -> Required
# reviewers). That makes every live deploy pause for a manual approval
# before it touches the server, even though the push already happened —
# see the setup guide, step "Protect the live environment".

on:
  push:
    branches: [main]

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, mysql, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload application files (everything except public/) over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LIVE_FTP_HOST }}
          username: ${{ secrets.LIVE_FTP_USERNAME }}
          password: ${{ secrets.LIVE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.LIVE_FTP_SERVER_DIR_APP }}
          # Never mirror-delete: only ever add/update files this build
          # produces. A missing file on the server (deploy-hook.config.php,
          # the renamed public entrypoint, storage/ contents) must never be
          # removed just because this checkout doesn't contain it.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            tests/**
            .env.example
            .env.ci
            phpunit.xml
            README.md
            **/.env
            storage/app/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/logs/**
            deploy/deploy-hook.config.php
            public/**

      - name: Upload public assets (public/ contents) over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LIVE_FTP_HOST }}
          username: ${{ secrets.LIVE_FTP_USERNAME }}
          password: ${{ secrets.LIVE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: public/
          server-dir: ${{ secrets.LIVE_FTP_SERVER_DIR_PUBLIC }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Trigger post-deploy Artisan tasks
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LIVE_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.LIVE_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true