name: Deploy to live

# Fires on every push to "main" (the live branch). The app is zipped and
# the built public/ folder is zipped separately (since 101gsd.in's document
# root is fixed to public_html and can't be pointed at live_app/public),
# both zips are FTP-uploaded to live_app/, and deploy/hook.php unzips
# each into the right place — the app zip into live_app/ itself, and the
# public zip into public_html/ (via deploy-hook.config.php's public_path).
#
# The two zips are uploaded with plain curl FTPS PUTs, NOT a directory-sync
# action. A directory-diffing FTP action (e.g. FTP-Deploy-Action) compares
# local-dir against everything already on the server and deletes anything
# not present locally — with local-dir reduced to just these two zips, that
# previously deleted live_app's entire vendor/app/bootstrap/config/storage/
# deploy tree in production. Never point a syncing/mirroring FTP action at
# a directory that holds anything this workflow doesn't fully reproduce.
#
# public_html/index.php is NOT included in public-release.zip — it has
# been manually customized on the server (it points sideways into
# live_app/ instead of Laravel's usual parent-directory convention, since
# live_app is a sibling of public_html, not its parent) and must never be
# overwritten by a deploy with the stock version from this repo's public/
# folder (which is also used, unmodified, by staging_app where the
# default parent-relative paths ARE correct).
#
# This uses the "production" GitHub Environment, which you configure with a
# required reviewer (Settings -> Environments -> production -> Required
# reviewers). That makes every live deploy pause for a manual approval
# before it touches the server, even though the push already happened —
# see the setup guide, step "Protect the live environment".

on:
  push:
    branches: [main]

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, mysql, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build app release archive (everything except public/)
        run: |
          mkdir -p dist release-app
          rsync -a ./ release-app/ \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github/**' \
            --exclude='node_modules/**' \
            --exclude='tests/**' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.env.ci' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='public/**' \
            --exclude='storage/app/**' \
            --exclude='storage/framework/cache/**' \
            --exclude='storage/framework/sessions/**' \
            --exclude='storage/framework/views/**' \
            --exclude='storage/logs/**' \
            --exclude='deploy/deploy-hook.config.php' \
            --exclude='dist/**' \
            --exclude='release-app/**' \
            --exclude='release-public/**'
          cd release-app && zip -rq ../dist/release.zip . && cd ..

      - name: Build public release archive (public/ contents, excluding index.php)
        run: |
          mkdir -p release-public
          rsync -a public/ release-public/ --exclude='index.php'
          cd release-public && zip -rq ../dist/public-release.zip . && cd ..

      - name: Upload release archives over FTPS (plain file upload — no directory sync, nothing gets deleted)
        env:
          FTP_HOST: ${{ secrets.LIVE_FTP_HOST }}
          FTP_USER: ${{ secrets.LIVE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.LIVE_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.LIVE_FTP_SERVER_DIR_APP }}
        run: |
          set -euo pipefail
          # Strip any leading/trailing slashes from FTP_DIR so exactly one
          # "/" always separates the host from the directory, regardless of
          # how the secret's value happens to be formatted.
          DIR_CLEAN="${FTP_DIR#/}"
          DIR_CLEAN="${DIR_CLEAN%/}"
          curl --ftp-ssl-reqd --show-error --fail \
            -T dist/release.zip \
            "ftp://${FTP_HOST}/${DIR_CLEAN}/release.zip" \
            --user "${FTP_USER}:${FTP_PASS}"
          curl --ftp-ssl-reqd --show-error --fail \
            -T dist/public-release.zip \
            "ftp://${FTP_HOST}/${DIR_CLEAN}/public-release.zip" \
            --user "${FTP_USER}:${FTP_PASS}"

      - name: Trigger release extraction
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LIVE_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.LIVE_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true extract

      - name: Trigger post-deploy Artisan tasks
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LIVE_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.LIVE_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true artisan
