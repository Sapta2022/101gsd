name: Deploy to live

# Fires on every push to "main" (the live branch). Same build steps as
# staging, and now the same transport too: the app is zipped and the
# built public/ folder is zipped separately (since 101gsd.in's document
# root is fixed to public_html and can't be pointed at live_app/public),
# both zips are FTP-uploaded to live_app/, and deploy/hook.php unzips
# each into the right place — the app zip into live_app/ itself, and the
# public zip into public_html/ (via deploy-hook.config.php's public_path).
#
# Zipping first avoids uploading the whole vendor/ tree as thousands of
# individual FTP connections, which this host has been observed to hang
# on — see deploy/hook.php's own docblock.
#
# This uses the "production" GitHub Environment, which you configure with a
# required reviewer (Settings -> Environments -> production -> Required
# reviewers). That makes every live deploy pause for a manual approval
# before it touches the server, even though the push already happened —
# see the setup guide, step "Protect the live environment".

on:
  push:
    branches: [main]

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, mysql, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies (production only)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build app release archive (everything except public/)
        run: |
          mkdir -p dist release-app
          rsync -a ./ release-app/ \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github/**' \
            --exclude='node_modules/**' \
            --exclude='tests/**' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.env.ci' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='public/**' \
            --exclude='storage/app/**' \
            --exclude='storage/framework/cache/**' \
            --exclude='storage/framework/sessions/**' \
            --exclude='storage/framework/views/**' \
            --exclude='storage/logs/**' \
            --exclude='deploy/deploy-hook.config.php' \
            --exclude='dist/**' \
            --exclude='release-app/**' \
            --exclude='release-public/**'
          cd release-app && zip -rq ../dist/release.zip . && cd ..

      - name: Build public release archive (public/ contents only)
        run: |
          mkdir -p release-public
          rsync -a public/ release-public/
          cd release-public && zip -rq ../dist/public-release.zip . && cd ..

      - name: Upload release archives over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LIVE_FTP_HOST }}
          username: ${{ secrets.LIVE_FTP_USERNAME }}
          password: ${{ secrets.LIVE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ${{ secrets.LIVE_FTP_SERVER_DIR_APP }}
          dangerous-clean-slate: false

      - name: Trigger release extraction
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LIVE_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.LIVE_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true extract

      - name: Trigger post-deploy Artisan tasks
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LIVE_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.LIVE_DEPLOY_HOOK_SECRET }}
        run: bash .github/scripts/call-deploy-hook.sh true artisan